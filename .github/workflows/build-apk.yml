name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install and bundle
        run: |
          npm ci
          npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Stable signing key (so updates install over the old version)
        run: |
          mkdir -p keystore ~/.android
          if [ ! -f keystore/lane.keystore ]; then
            keytool -genkeypair -keystore keystore/lane.keystore -alias androiddebugkey \
              -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "lane-build"
            git config user.email "actions@users.noreply.github.com"
            git add keystore/lane.keystore
            git commit -m "Add stable signing key [skip ci]"
            git push || echo "::warning::Could not save the signing key to the repo. Each new build will need a reinstall (export a backup first)."
          fi
          cp keystore/lane.keystore ~/.android/debug.keystore

      - name: Sync and build
        run: |
          npx cap sync android
          cd android
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: lane-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
