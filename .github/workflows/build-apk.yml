name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install and bundle
        env:
          LANE_BUILD: ${{ github.run_number }}
        run: |
          npm ci
          npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Allow the Google sign-in redirect (reversed client ID scheme)
        run: |
          python3 - <<'PY'
          import re
          cid = re.search(r"GOOGLE_CLIENT_ID = '([^']*)'", open('src/config.js').read()).group(1)
          scheme = 'com.googleusercontent.apps.' + cid.split('.')[0]
          print('redirect scheme:', scheme)
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          f = ('<intent-filter><action android:name="android.intent.action.VIEW"/>'
               '<category android:name="android.intent.category.DEFAULT"/>'
               '<category android:name="android.intent.category.BROWSABLE"/>'
               '<data android:scheme="' + scheme + '"/></intent-filter>')
          assert '</activity>' in s
          s = s.replace('</activity>', f + '</activity>', 1)
          # Camera plugin: gallery access on older Android versions (camera itself needs no permission here)
          perms = ('<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>'
                   '<uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>')
          s = s.replace('<application', perms + '<application', 1)
          open(p, 'w').write(s)
          PY

      - name: Stable signing key (so updates install over the old version)
        run: |
          mkdir -p keystore ~/.android
          if [ ! -f keystore/lane.keystore ]; then
            keytool -genkeypair -keystore keystore/lane.keystore -alias androiddebugkey \
              -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "lane-build"
            git config user.email "actions@users.noreply.github.com"
            git add keystore/lane.keystore
            git commit -m "Add stable signing key [skip ci]"
            git push || echo "::warning::Could not save the signing key to the repo. Each new build will need a reinstall (export a backup first)."
          fi
          cp keystore/lane.keystore ~/.android/debug.keystore

      - name: Sync and build (signed with the repo key)
        run: |
          npx cap sync android
          cd android
          ./gradlew assembleDebug --no-daemon \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/keystore/lane.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android

      - name: Verify the APK is signed with the repo key
        run: |
          want=$(keytool -list -v -keystore keystore/lane.keystore -storepass android | grep SHA1 | head -1 | awk '{print $2}')
          got=$(keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep SHA1 | head -1 | awk '{print $2}')
          echo "repo key: $want"; echo "apk key:  $got"
          [ "$want" = "$got" ] || { echo "::error::APK signed with the wrong key"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: lane-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish release (so the app can find updates)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk lane.apk
          gh release create "build-${{ github.run_number }}" lane.apk \
            --title "Lane build ${{ github.run_number }}" \
            --notes "$(git log -1 --pretty=%s)" --latest
