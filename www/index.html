<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B5C82">
<title>Lane</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F2F7F8; --surface: #FFFFFF; --ink: #13242E; --muted: #57707D; --line: #D3E2E7;
    --pool: #0B5C82; --on-pool: #FFFFFF; --pool-soft: #DCEEF4; --rope: #E03A3E; --rope-light: #A9D2E2;
    --good: #1C845C; --warn: #9A5B00;
    --num: 'Barlow Condensed', 'Roboto Condensed', 'Arial Narrow', sans-serif;
    --body: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0A1C26; --surface: #10293A; --ink: #E4F1F5; --muted: #93AAB5; --line: #1E3D50;
      --pool: #55B8DE; --on-pool: #052231; --pool-soft: #123A4F; --rope: #FF5C60; --rope-light: #3A7792;
      --good: #43C690; --warn: #E8A94A; color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
  body { padding: env(safe-area-inset-top, 0px) 0 calc(76px + env(safe-area-inset-bottom, 0px)); }
  main { max-width: 560px; margin: 0 auto; padding: 18px 20px 28px; }
  header { margin-bottom: 14px; }
  h1 { font-family: var(--num); font-weight: 700; font-size: 32px; line-height: 1.1; margin: 0; letter-spacing: .005em; }
  h2 { font-size: 19px; margin: 0 0 8px; }
  p { margin: 0 0 10px; }
  .sub { color: var(--muted); font-size: 15px; }
  section { padding: 20px 0; border-top: 1px solid var(--line); }
  .ok { color: var(--good); font-weight: 700; }
  .warn { color: var(--warn); }

  /* The lane: progress as a pool lane rope */
  .lane { background: var(--surface); border-radius: 18px; padding: 16px 18px 12px; margin-bottom: 8px; border: 1px solid var(--line); }
  .lane-head { display: flex; align-items: flex-end; gap: 14px; margin-bottom: 14px; }
  .pct { font-family: var(--num); font-weight: 700; font-size: 84px; line-height: .8; color: var(--pool); font-variant-numeric: tabular-nums; }
  .pct small { font-size: 40px; }
  .lane-cap { color: var(--muted); font-size: 15px; line-height: 1.35; padding-bottom: 2px; }
  .lane-cap b { color: var(--ink); }
  .rope { position: relative; height: 14px; border-radius: 7px; }
  .rope::before { content: ""; position: absolute; inset: 0; border-radius: 7px; background: repeating-linear-gradient(90deg, var(--rope) 0 16px, var(--rope-light) 16px 32px); opacity: .22; }
  .rope-done { position: absolute; inset: 0 auto 0 0; border-radius: 7px; background: repeating-linear-gradient(90deg, var(--rope) 0 16px, var(--rope-light) 16px 32px); z-index: 1; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
  .swimmer { position: absolute; top: 50%; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; background: var(--pool); border: 3px solid var(--surface); z-index: 2; }
  .marks { display: flex; justify-content: space-between; font-family: var(--num); font-weight: 600; font-size: 17px; color: var(--muted); margin-top: 8px; }

  .banner { display: flex; gap: 12px; align-items: center; justify-content: space-between; background: var(--pool-soft); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; font-size: 15px; }
  .fresh { background: var(--pool-soft); border-radius: 14px; padding: 16px; border: 0; margin: 12px 0; }

  .btn { font: inherit; font-weight: 700; border: 2px solid var(--pool); border-radius: 12px; padding: 12px 16px; min-height: 50px; background: var(--pool); color: var(--on-pool); cursor: pointer; text-align: center; }
  .btn.ghost { background: transparent; color: var(--pool); }
  .btn.big { min-height: 64px; font-size: 19px; }
  .btn.small { min-height: 40px; padding: 8px 12px; font-size: 15px; white-space: nowrap; }
  .link { font: inherit; background: none; border: 0; color: var(--pool); padding: 8px 0; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .link.danger { color: var(--rope); margin-top: 12px; }
  .row { display: flex; gap: 10px; margin-bottom: 6px; }
  .row > * { flex: 1; }
  :focus-visible { outline: 3px solid var(--rope); outline-offset: 2px; }

  .choices { display: grid; gap: 10px; }
  .choice { font: inherit; text-align: left; background: var(--surface); color: var(--ink); border: 2px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 2px; cursor: pointer; }
  .choice b { font-size: 18px; color: var(--pool); }
  .choice span { color: var(--muted); font-size: 15px; }

  input[type=text], input[type=number], input[type=time], input[type=url], input[type=date], input:not([type]), select {
    font: inherit; width: 100%; margin-top: 4px; padding: 11px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
  }
  label { display: block; font-size: 15px; color: var(--muted); }
  .form, .weigh, .ifthen { display: grid; gap: 12px; }
  .toggle { display: flex; gap: 10px; align-items: center; color: var(--ink); font-size: 16px; padding: 8px 0; }
  .toggle input, .micro input { width: 22px; height: 22px; accent-color: var(--pool); flex: none; }
  .file input { margin-top: 6px; font-size: 14px; color: var(--muted); }
  .file-btn { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .file-btn input { position: absolute; inset: 0; opacity: 0; }

  ul.ex, ul.plain, ul.micro, ul.log { list-style: none; padding: 0; margin: 6px 0 10px; }
  ul.ex li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
  ul.ex li:has(details) { display: block; }
  details.how summary { display: flex; justify-content: space-between; gap: 12px; color: var(--ink); font-weight: 400; padding: 0; list-style: none; }
  details.how summary::-webkit-details-marker { display: none; }
  details.how summary > span:first-child { text-decoration: underline dotted var(--muted); text-underline-offset: 3px; }
  details.how[open] summary > span:first-child { color: var(--pool); }
  details.how p { font-size: 15px; margin: 8px 0 0; }
  details.how p.sub { margin-bottom: 4px; }
  details.micro-how { margin: -4px 0 6px 34px; }
  details.micro-how summary { color: var(--pool); font-size: 14px; text-decoration: underline dotted; }
  ul.ex .dose { color: var(--muted); text-align: right; font-size: 15px; flex: none; max-width: 45%; }
  ul.plain li { padding: 5px 0 5px 16px; position: relative; }
  ul.plain li::before { content: ""; position: absolute; left: 0; top: 14px; width: 7px; height: 7px; border-radius: 50%; background: var(--pool); }
  ul.micro li label { display: flex; gap: 12px; align-items: center; color: var(--ink); font-size: 16px; padding: 9px 0; }
  ul.log li { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid var(--line); }
  details summary { cursor: pointer; color: var(--pool); font-weight: 700; padding: 8px 0; }

  ol.week { list-style: none; padding: 0; margin: 0 0 8px; }
  ol.week li { border-top: 1px solid var(--line); }
  ol.week > li > details > summary { display: grid; grid-template-columns: 64px 1fr auto; gap: 10px; align-items: baseline; color: var(--ink); font-weight: 400; padding: 13px 0; list-style: none; }
  ol.week > li > details > summary::-webkit-details-marker { display: none; }
  ol.week .day { font-family: var(--num); font-weight: 700; font-size: 19px; color: var(--muted); }
  ol.week .what { font-weight: 700; }
  ol.week .when { font-family: var(--num); font-weight: 600; font-size: 18px; color: var(--pool); }
  ol.week li.is-today .day { color: var(--pool); }
  ol.week li.is-done .when { color: var(--good); }
  ol.week details > :not(summary) { margin-left: 74px; }

  dl.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 10px; margin: 0 0 14px; }
  dl.stats dt { color: var(--muted); font-size: 14px; }
  dl.stats dd { margin: 0; font-family: var(--num); font-weight: 700; font-size: 30px; line-height: 1.1; }
  .chart { width: 100%; height: auto; display: block; }
  .chart .line { fill: none; stroke: var(--pool); stroke-width: 2.5; stroke-linejoin: round; }
  .chart .dot { fill: var(--pool); }
  .chart .goal { stroke: var(--rope); stroke-width: 1.5; stroke-dasharray: 5 5; }
  .chart .lbl { fill: var(--muted); font-size: 11px; font-family: var(--body); }
  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .compare figure { margin: 0; }
  .compare img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 12px; background: var(--pool-soft); }
  .compare figcaption { font-size: 14px; color: var(--muted); margin-top: 4px; }

  /* food */
  h3 { font-size: 16px; margin: 14px 0 4px; }
  h3 .sub { font-weight: 400; }
  .care { background: var(--pool-soft); border-radius: 12px; padding: 10px 12px; color: var(--ink); margin: 4px 0 0; }
  .seg { display: flex; gap: 6px; margin-bottom: 8px; }
  .seg button { flex: 1; font: inherit; padding: 9px; min-height: 44px; border-radius: 10px; border: 2px solid var(--pool); background: transparent; color: var(--pool); font-weight: 700; cursor: pointer; }
  .seg button[aria-pressed=true] { background: var(--pool); color: var(--on-pool); }
  ol.plan { list-style: none; padding: 0; margin: 0 0 12px; }
  ol.plan > li { border-top: 1px solid var(--line); padding: 10px 0; }
  ol.plan > li.is-today .plan-head b { color: var(--pool); }
  .plan-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  .plan-head b { font-family: var(--num); font-size: 19px; }
  .slot { display: grid; grid-template-columns: 82px 1fr; align-items: center; gap: 8px; font-size: 15px; padding: 2px 0; }
  .slot select { margin: 0; padding: 8px 10px; min-width: 0; }
  ol.steps { padding-left: 20px; margin: 6px 0 10px; }
  ol.steps li { padding: 4px 0; }
  details summary .sub { font-weight: 400; }
  dl.mix { display: grid; grid-template-columns: 96px 1fr; gap: 4px 10px; margin: 6px 0 8px; }
  dl.mix dt { color: var(--muted); font-size: 15px; }
  dl.mix dd { margin: 0; }
  .got { text-decoration: line-through; color: var(--muted); }
  .meal-empty { list-style: none; padding: 6px 0; }
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 5; }
  .tabs button { flex: 1; font: inherit; font-size: 15px; background: none; border: 0; color: var(--muted); padding: 10px 4px 14px; min-height: 60px; cursor: pointer; position: relative; }
  .tabs button[aria-current=page] { color: var(--pool); font-weight: 700; }
  .tabs button[aria-current=page]::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; border-radius: 0 0 3px 3px; background: var(--pool); }
  #toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 15px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: 90vw; z-index: 6; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<nav class="tabs" aria-label="Sections">
  <button data-tab="today" aria-current="page">Today</button>
  <button data-tab="train">Train</button>
  <button data-tab="food">Food</button>
  <button data-tab="progress">Progress</button>
  <button data-tab="settings">Settings</button>
</nav>
<div id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
